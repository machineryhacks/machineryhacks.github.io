 <script>
(function () {
  const path = window.location.pathname;
  const slug = path.replace(/^\/+|\/+$/g, '');

  // Nothing to do
  if (!slug) {
    window.location.replace('/');
    return;
  }

  // URLs that should not be treated as posts
  const excluded = [
    'post',
    'assets',
    'tag',
    'css',
    'js',
    'images',
    'image',
    'favicon.ico',
    'robots.txt',
    'rss.xml',
    'sitemap.xml'
  ];

  // For excluded paths, stay on the normal 404 page
  if (excluded.some(function (item) {
    return slug === item || slug.startsWith(item + '/');
  })) {
    return;
  }

  // Actual post URL
  const target = '/post/' + slug + '/';

  // Check if the post exists
  fetch(target, {
    method: 'HEAD',
    cache: 'no-store'
  })
  .then(function (response) {

    if (response.ok) {
      // Correct post exists
      window.location.replace(target);
    } else {
      // Wrong URL → homepage
      window.location.replace('/');
    }

  })
  .catch(function () {
    // If checking fails, go to homepage
    window.location.replace('/');
  });

})();
</script>
